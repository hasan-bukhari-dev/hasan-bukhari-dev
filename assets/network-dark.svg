<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img">
<style>
text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.edge { stroke:#2b3745; stroke-width:1.5; stroke-dasharray:8 10; animation:flow 9s linear infinite; }
.halo { fill:none; stroke:#a78bfa; stroke-width:1.2; opacity:.08; }
.node-core .halo { animation:pulse 2.4s ease-in-out infinite; }
.node-domain .halo { animation:pulse 3.2s ease-in-out infinite; }
.node-project .halo,.node-research .halo { animation:pulse 4.2s ease-in-out infinite; }
.signal { stroke:#66b7ff; stroke-width:1.8; fill:none; stroke-dasharray:12 12; animation:flow 7s linear infinite; }
@keyframes flow { to { stroke-dashoffset:-180; } }
@keyframes pulse { 0%,100% { opacity:.06; transform:scale(1); } 50% { opacity:.34; transform:scale(1.11); } }
@media (prefers-reduced-motion: reduce) { .edge,.signal,.halo { animation:none; } }
</style>
